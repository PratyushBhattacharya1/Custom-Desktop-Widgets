<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../shared/widget.css" />
<link rel="stylesheet" href="calendar.css" />
</head>
<body>
  <div class="card">
    <div class="cal-header">
      <button class="cal-label" id="label" type="button" title="Pick a month"></button>
      <button class="today-pill" id="today-btn" type="button">Today</button>
      <div class="chevrons">
        <button class="chevron" id="prev" type="button" aria-label="Previous month" title="Previous">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
        <button class="chevron" id="next" type="button" aria-label="Next month" title="Next">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>
    </div>

    <div id="day-view">
      <!-- The weekday strip is its own table so it can hold still while the grid
           below cross-fades. Both are table-layout:fixed at the same width, so
           the seven columns resolve identically with nothing to keep in sync. -->
      <table class="weekdays" aria-hidden="true">
        <thead>
          <tr>
            <th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th><th>S</th>
          </tr>
        </thead>
      </table>
      <div class="days-stack">
        <table class="days">
          <tbody id="grid"></tbody>
        </table>
      </div>
    </div>

    <div id="month-view" hidden>
      <div class="month-grid" id="month-grid"></div>
    </div>

    <div class="events" id="events">
      <div class="events-scroll thin-scroll" id="events-scroll"></div>
    </div>
  </div>

  <script src="calendar.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/pin.js"></script>
</body>
</html>
