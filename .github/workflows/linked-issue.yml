name: Linked issue

# Every change starts as an issue. GitHub can't check that the issue came
# first, but it can refuse a PR that doesn't close one.
on:
  pull_request:
    # GitHub resolves closing keywords only on PRs into the default branch.
    branches: [main]
    # edited: fixing the description re-runs the check.
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  issues: read

jobs:
  # Required status check; see the note on the job in ci.yml.
  linked-issue:
    # Bot PRs such as Dependabot's have no issue. A skipped job counts as passed.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require "Closes #<issue>" in the description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # closingIssuesReferences is GitHub's own parse of the description,
          # plus any issue linked by hand in the Development sidebar. It can
          # trail an edit by a moment, so retry briefly before failing.
          for attempt in 1 2 3; do
            issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
              --json closingIssuesReferences \
              --jq '[.closingIssuesReferences[] | "#\(.number)"] | join(" ")')
            if [ -n "$issues" ]; then
              echo "Closes $issues"
              exit 0
            fi
            sleep 5
          done
          echo "::error::This PR doesn't close an issue. Open one first, then put 'Closes #<number>' in the description."
          exit 1
