name: Linked issue

# Every change starts as an issue. GitHub can't check that the issue came
# first, but it can refuse a PR that doesn't close one.
on:
  pull_request:
    # GitHub resolves closing keywords only on PRs into the default branch.
    branches: [main]
    # edited: fixing the description re-runs the check.
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  issues: read

jobs:
  # Required status check; see the note on the job in ci.yml.
  linked-issue:
    # Bot PRs such as Dependabot's have no issue. A skipped job counts as passed.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require "Closes #<issue>" in the description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # closingIssuesReferences is GitHub's own parse of the description,
          # plus any issue linked by hand in the Development sidebar. Linking
          # there fires no pull_request event, so re-run this job afterwards.
          # Only an open issue in this repo counts; a cross-repo or closed one
          # would pass without anything tracking the change. The parse can
          # trail an edit by a moment and the API can fail transiently, so
          # retry briefly before failing; `|| issues=` stops bash -e from
          # aborting on the first API error.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then sleep 5; fi
            issues=$(gh api graphql \
              -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PR" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 25) {
                        nodes { number state repository { nameWithOwner } }
                      }
                    }
                  }
                }' \
              --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[]
                | select(.state == "OPEN" and .repository.nameWithOwner == env.GITHUB_REPOSITORY)
                | "#\(.number)"] | join(" ")') || issues=
            if [ -n "$issues" ]; then
              echo "Closes $issues"
              exit 0
            fi
          done
          echo "::error::This PR doesn't close an open issue in this repo. Open one first, then put 'Closes #<number>' in the description."
          exit 1
